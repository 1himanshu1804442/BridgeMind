name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  # ---------------------------------------------------------------------------
  # Existing job: Run backend Maven tests
  # ---------------------------------------------------------------------------
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Run Maven Tests
        run: mvn clean test

  # ---------------------------------------------------------------------------
  # Existing job: Run frontend tests and build
  # ---------------------------------------------------------------------------
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies
        run: npm ci
      - name: Run Tests
        run: npm test
      - name: Run Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # New job: Validate Docker builds
  # Runs AFTER both test jobs pass to ensure Dockerfiles are valid and
  # the application can be packaged into containers successfully.
  # ---------------------------------------------------------------------------
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: docker build -t hivepilot-backend ./backend

      - name: Build Frontend Docker Image
        run: docker build -t hivepilot-frontend ./frontend
