# =============================================================================
# HivePilot Frontend - Nginx Configuration
# Handles: static file serving, SPA routing, API reverse proxy,
#          gzip compression, and cache headers.
# =============================================================================

server {
    listen 80;
    server_name _;

    # Root directory where the built React/Vite app lives
    root /usr/share/nginx/html;
    index index.html;

    # -------------------------------------------------------------------------
    # Gzip Compression
    # Reduces payload size for text-based assets, improving load times.
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # -------------------------------------------------------------------------
    # API Reverse Proxy
    # Forward /api/* requests to the backend Spring Boot service.
    # "backend" resolves via Docker Compose's internal DNS.
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------------------------
    # WebSocket Reverse Proxy
    # Forward /ws and /ws/* SockJS/STOMP connections to Spring Boot
    # -------------------------------------------------------------------------
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # -------------------------------------------------------------------------
    # Static Asset Caching
    # Vite hashes filenames on build, so these files can be cached aggressively.
    # 1 year cache with immutable tells browsers to never revalidate.
    # -------------------------------------------------------------------------
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # -------------------------------------------------------------------------
    # SPA Fallback
    # For any route that doesn't match a real file, serve index.html so the
    # React router can handle client-side routing.
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
