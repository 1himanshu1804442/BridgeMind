spring:
  application:
    name: hivepilot
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hivepilot}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:changeme}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080
