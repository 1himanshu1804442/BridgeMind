spring:
  application:
    name: hivepilot
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:changeme}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bridgemind}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:changeme}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

execution:
  docker:
    workspace-root: ${WORKSPACE_ROOT:./workspaces}
    allowed-images: ${DOCKER_ALLOWED_IMAGES:alpine:3.20,codex-cli:latest,claude-code:latest,aider:latest}
    timeout-seconds: ${DOCKER_TIMEOUT_SECONDS:60}
    memory-limit: ${DOCKER_MEMORY_LIMIT:512m}
    cpu-limit: ${DOCKER_CPU_LIMIT:1.0}

# JWT authentication configuration
jwt:
  secret: ${JWT_SECRET:default-dev-secret-key-that-is-at-least-256-bits-long-for-hs256}
  expiration-ms: ${JWT_EXPIRATION:86400000}
