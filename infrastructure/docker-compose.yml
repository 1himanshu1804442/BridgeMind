version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bridgemind-postgres
    environment:
      POSTGRES_USER: bridgemind
      POSTGRES_PASSWORD: bridgemind_password
      POSTGRES_DB: bridgemind_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: bridgemind-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning

  pgadmin:
    image: dpage/pgadmin4
    container_name: bridgemind-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bridgemind.local
      PGADMIN_DEFAULT_PASSWORD: admin_password
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
